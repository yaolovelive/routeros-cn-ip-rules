name: Update RouterOS CN rules

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-routeros-cn-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Generate RouterOS rules
        run: python3 scripts/generate.py
      - name: Commit changes
        run: |
          if git diff --quiet -- CN.rsc CN.count.txt CN.source.txt; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CN.rsc CN.count.txt CN.source.txt
          git commit -m "chore: update RouterOS CN rules"
          git push
